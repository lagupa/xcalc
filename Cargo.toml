[package]
name = "xcalc"
version = "0.1.0"
edition = "2024"
description = "A tiny WebAssembly calculator for demo purposes"
license = "MIT"
repository = "https://github.com/lagupa/xcalc"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true